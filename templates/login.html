<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuki WebUI – Login</title>
    <style>
        :root {
            --bg-color: #0b0f14;
            --card-bg: #1a1f26;
            --text-color: #e0e0e0;
            --accent: #6c5ce7;
            --error: #d63031;
            --border-color: #2d3436;
        }
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            width: 360px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            margin-bottom: 24px;
            font-weight: 400;
            text-align: center;
            color: var(--accent);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9em;
        }
        input {
            width: 100%;
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1em;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #7d6ef0;
        }
        .flash-message {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }
        .flash-error {
            background: rgba(214, 48, 49, 0.2);
            color: var(--error);
            border: 1px solid var(--error);
        }
        .flash-success {
            background: rgba(0, 184, 148, 0.2);
            color: #00b894;
            border: 1px solid #00b894;
        }
        .info-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🌌 Yuki WebUI</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
        <div class="info-text">Yuki System v1.0</div>
    </div>
</body>
</html>
